<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المواد التعليمية</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    <style>
        /* ========== جميع الأنماط كما هي بدون تغيير ========== */

        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-body); margin: 0; padding: 0; color: var(--text-primary); transition: background 0.6s, color 0.4s; scroll-behavior: smooth; }
        header { background: var(--bg-header); color: var(--text-white); text-align: center; padding: 10px 0 8px; box-shadow: 0 4px 6px var(--shadow); position: sticky; top: 0; z-index: 1100; transition: background 0.6s; }
        header h1 { margin: 0 0 8px; font-size: 24px; }
        .header-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 10px 6px; }
        .theme-controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .theme-pill { background: var(--theme-btn-bg); color: var(--theme-btn-text); border: 2px solid transparent; padding: 6px 14px; border-radius: 50px; cursor: pointer; font-size: 13px; font-weight: bold; transition: all 0.3s; display: inline-flex; align-items: center; gap: 5px; }
        .theme-pill:hover { background: var(--theme-btn-active); transform: scale(1.04); }
        .theme-pill.active { border-color: var(--text-white); background: var(--theme-btn-active); box-shadow: 0 0 12px rgba(255,255,255,0.2); }
        .demo-btn { background: #e67e22; color: #fff; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; transition: all 0.3s; animation: demoPulse 1.5s infinite; }
        .demo-btn:hover { filter: brightness(1.15); transform: scale(1.05); }
        @keyframes demoPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(230,126,34,0.4); } 50% { box-shadow: 0 0 0 8px rgba(230,126,34,0); } }
        .auto-only { display: none; }
        .auto-visible .auto-only { display: inline-block; }
        .notif-bell-wrap { position: relative; display: inline-block; cursor: pointer; margin: 0 4px; }
        .notif-bell { font-size: 22px; color: var(--text-white); transition: transform 0.3s; }
        .notif-bell-wrap:hover .notif-bell { transform: scale(1.2); }
        .notif-badge { position: absolute; top: -6px; left: -8px; background: var(--danger); color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; font-weight: bold; display: none; align-items: center; justify-content: center; pointer-events: none; animation: badgePulse 2s infinite; }
        @keyframes badgePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        .notif-dropdown { display: none; position: absolute; top: 42px; left: 0; background: var(--notif-bg); border: 2px solid var(--border); border-radius: 12px; width: 380px; max-height: 450px; overflow-y: auto; box-shadow: 0 10px 30px var(--shadow); z-index: 2000; padding: 0; text-align: right; transition: background 0.4s, border-color 0.4s; }
        .notif-dropdown.show { display: block; }
        .notif-dropdown h4 { margin: 0; padding: 14px 18px; background: var(--bg-header); color: var(--text-white); font-size: 16px; border-radius: 10px 10px 0 0; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        .notif-dropdown h4 .notif-clear { font-size: 12px; cursor: pointer; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; border: none; color: #fff; }
        .notif-item { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.6; transition: background 0.3s; cursor: default; }
        .notif-item.unread { background: var(--notif-unread-bg); font-weight: bold; }
        .notif-item .notif-meta { font-size: 10px; color: var(--text-hint); margin-top: 4px; }
        .notif-item .notif-detail { display: block; margin: 3px 0; font-size: 12px; }
        .notif-empty { padding: 30px; text-align: center; color: var(--text-hint); font-size: 14px; }
        .container { max-width: 980px; width: 100%; margin: 20px auto; padding: 0 16px 60px; }
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-button { background: var(--accent); color: var(--text-white); border: none; padding: 12px 25px; font-size: 18px; cursor: pointer; border-radius: 8px; transition: background 0.3s; }
        .tab-button:hover { background: var(--accent-hover); }
        .tab-button.active { background: var(--accent-active); }
        .content-section { display: none; background: var(--bg-content); padding: 30px; border-radius: 10px; box-shadow: 0 2px 5px var(--shadow); transition: background 0.6s; }
        .content-section.active { display: block; }
        .card { background: var(--bg-card); padding: 15px 20px; margin-bottom: 12px; border-radius: 10px; border-right: 5px solid var(--card-border); cursor: pointer; transition: transform 0.2s, background 0.4s; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .card:hover { transform: translateX(-5px); background: var(--bg-card-hover); }
        .card-text { flex: 1; min-width: 160px; }
        .card-text h3 { margin: 0 0 5px; color: var(--text-heading); font-size: 18px; }
        .card-text p { margin: 0; color: var(--text-secondary); font-size: 14px; }
        .badge { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .badge.done { background: var(--success); color: #fff; }
        .badge.new { background: var(--text-hint); color: #fff; opacity: 0.7; }
        .btn-sm { background: var(--accent); color: #fff; border: none; padding: 5px 10px; border-radius: 15px; cursor: pointer; font-size: 11px; font-weight: bold; transition: all 0.3s; white-space: nowrap; }
        .btn-sm:hover { filter: brightness(1.2); transform: scale(1.05); }
        .btn-download-exam { background: var(--download-btn-bg); }
        .back-btn { background: var(--danger); color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-bottom: 20px; transition: background 0.3s; }
        .back-btn:hover { background: var(--danger-hover); }
        .pdf-viewer { border: 2px solid var(--border); border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        iframe { width: 100%; height: 600px; border: none; display: block; }
        .questions-box { background: var(--bg-card); padding: 20px; border-radius: 8px; border-right: 5px solid var(--success); }
        .sub-tabs { display: flex; gap: 8px; margin: 20px 0; border-bottom: 2px solid var(--border); padding-bottom: 15px; flex-wrap: wrap; }
        .sub-tab-button { background: var(--subtab-bg); color: var(--text-primary); border: none; padding: 10px 18px; cursor: pointer; border-radius: 20px; font-size: 15px; transition: 0.3s; }
        .sub-tab-button.active { background: var(--subtab-active-bg); color: #fff; font-weight: bold; }
        .sub-tab-button:hover:not(.active) { background: var(--bg-card-hover); }
        .sub-content { display: none; }
        .sub-content.active { display: block; }
        .quiz-scroll-container { border: 2px solid var(--border); border-radius: 10px; background: var(--bg-quiz-container); padding: 10px; }
        .quiz-card { background: var(--bg-quiz-card); margin-bottom: 15px; padding: 20px; border-radius: 10px; box-shadow: 0 2px 6px var(--shadow); text-align: right; }
        .quiz-number { background: var(--quiz-number-bg); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 20px; }
        .quiz-question-text { font-size: 22px; font-weight: bold; margin-bottom: 30px; color: var(--text-heading); line-height: 1.6; }
        .quiz-options { display: flex; flex-direction: column; gap: 8px; }
        .quiz-option-btn { padding: 10px 16px; font-size: 20px; border: 2px solid var(--option-border); background: var(--bg-quiz-card); color: var(--option-text); border-radius: 8px; cursor: pointer; text-align: right; transition: all 0.3s; }
        .quiz-option-btn:hover { background: var(--option-hover-bg); }
        .quiz-option-btn.correct { background: var(--success); color: #fff; border-color: var(--success); }
        .quiz-option-btn.incorrect { background: var(--danger); color: #fff; border-color: var(--danger); }
        .quiz-option-btn.disabled { opacity: 0.6; pointer-events: none; }
        .quiz-feedback { margin-top: 15px; font-size: 18px; font-weight: bold; display: none; }
        .quiz-feedback.show { display: block; }
        .quiz-feedback.correct-text { color: var(--success); }
        .quiz-feedback.wrong-text { color: var(--danger); }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .reset-btn { background: var(--warning); color: #fff; border: none; padding: 10px 22px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        .reset-btn:hover { background: var(--warning-hover); }
        .progress-bar-wrap { background: var(--progress-bg); border-radius: 20px; height: 14px; margin-bottom: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--progress-fill-1), var(--progress-fill-2)); border-radius: 20px; transition: width 0.5s ease; width: 0%; }
        .progress-text { text-align: center; font-size: 14px; color: var(--text-hint); margin-bottom: 8px; font-weight: bold; }
        .show-score-btn { background: linear-gradient(135deg, var(--show-score-bg-1), var(--show-score-bg-2)); color: #fff; border: none; padding: 18px 50px; border-radius: 50px; cursor: pointer; font-size: 22px; font-weight: bold; transition: all 0.5s; box-shadow: 0 6px 20px var(--show-score-shadow); }
        .show-score-btn:hover { transform: scale(1.08); }
        .score-card { background: linear-gradient(135deg, var(--score-bg-1), var(--score-bg-2)); color: #fff; margin: 15px 0; border-radius: 10px; padding: 35px 25px; text-align: center; box-shadow: 0 4px 10px var(--shadow); }
        .score-circle { width: 130px; height: 130px; border-radius: 50%; border: 8px solid var(--score-circle-border); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 20px; background: var(--score-circle-bg); }
        .score-number { font-size: 42px; font-weight: bold; line-height: 1; }
        .score-label { font-size: 14px; opacity: 0.8; }
        .score-details { font-size: 17px; margin-bottom: 8px; }
        .score-message { font-size: 22px; font-weight: bold; margin-bottom: 15px; }

<body>

    <script>
        // ========== Theme System ==========
        var themeMode = localStorage.getItem('themeMode') || 'auto';
        var demoInterval = null;
        var isDemoRunning = false;
        var themeNames = { light: 'Light', dark: 'Dark', morning: 'Morning', noon: 'Noon', afternoon: 'Afternoon', night: 'Night' };
        function setThemeMode(mode) { themeMode = mode; localStorage.setItem('themeMode', mode); updateThemeUI(); applyTimeTheme(); }
        function updateThemeUI() {
            var btns = document.querySelectorAll('.theme-pill');
            btns.forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-mode') === themeMode); });
            var ctrl = document.getElementById('theme-controls');
            if (themeMode === 'auto') ctrl.classList.add('auto-visible'); else ctrl.classList.remove('auto-visible');
        }
        function getAutoTheme(hour) { if (hour >= 6 && hour < 12) return 'morning'; if (hour >= 12 && hour < 15) return 'noon'; if (hour >= 15 && hour < 18) return 'afternoon'; return 'night'; }
        function applyTheme(themeName) { document.documentElement.setAttribute('data-theme', themeName); }
        function applyTimeTheme() {
            if (themeMode === 'light') applyTheme('light');
            else if (themeMode === 'dark') applyTheme('dark');
            else applyTheme(getAutoTheme(new Date().getHours()));
            updateStatusBar();
        }
        function formatTime(date) { var h = date.getHours(), m = date.getMinutes(), s = date.getSeconds(); var ampm = h >= 12 ? 'PM' : 'AM'; var h12 = h % 12 || 12; return h12 + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + ' ' + ampm; }
        function updateStatusBar(fakeTime) {
            var bar = document.getElementById('status-bar');
            var currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            var name = themeNames[currentTheme] || currentTheme;
            var timeStr = fakeTime ? fakeTime : formatTime(new Date());
            bar.innerHTML = 'Theme Sync: ' + name + ' — ' + timeStr + ' <span class="status-dot"></span>';
        }
        function runDemo() {
            if (isDemoRunning) return;
            isDemoRunning = true;
            var btn = document.getElementById('demo-btn');
            btn.textContent = '⏸ Running...';
            btn.style.animation = 'none';
            var stages = [
                { theme: 'morning', label: '6:00:00 AM' },
                { theme: 'noon', label: '12:00:00 PM' },
                { theme: 'afternoon', label: '3:30:00 PM' },
                { theme: 'night', label: '8:00:00 PM' }
            ];
            var idx = 0;
            applyTheme(stages[0].theme);
            updateStatusBar(stages[0].label);
            demoInterval = setInterval(function() {
                idx++;
                if (idx >= stages.length) {
                    clearInterval(demoInterval);
                    isDemoRunning = false;
                    btn.textContent = '▶ Run 24h Demo';
                    btn.style.animation = '';
                    applyTimeTheme();
                    return;
                }
                applyTheme(stages[idx].theme);
                updateStatusBar(stages[idx].label);
            }, 2500);
        }
        (function initTheme() { updateThemeUI(); applyTimeTheme(); })();
        setInterval(function() { if (!isDemoRunning && themeMode === 'auto') applyTimeTheme(); else if (!isDemoRunning) updateStatusBar(); }, 1000);

        // ========== Scroll to Top ==========
        var scrollToTopBtn = document.getElementById('scroll-to-top');
        window.addEventListener('scroll', function() { if (window.scrollY > 350) scrollToTopBtn.classList.add('visible'); else scrollToTopBtn.classList.remove('visible'); });
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        // ========== Notification System ==========
        var notifications = [], auditLogs = [];
        function loadNotifications() {
            try { var n = localStorage.getItem('notifications_data'); if (n) notifications = JSON.parse(n); } catch (e) { notifications = []; }
            try { var a = localStorage.getItem('audit_logs'); if (a) auditLogs = JSON.parse(a); } catch (e) { auditLogs = []; }
        }
        function saveNotifications() { try { localStorage.setItem('notifications_data', JSON.stringify(notifications)); } catch (e) {} try { localStorage.setItem('audit_logs', JSON.stringify(auditLogs)); } catch (e) {} }
        function addNotification(notif) {
            notif.id = Date.now(); notif.read = false; notif.time = formatTime(new Date()); notif.date = new Date().toLocaleDateString('ar-EG');
            notifications.unshift(notif);
            if (notifications.length > 50) notifications = notifications.slice(0, 50);
            saveNotifications(); updateNotifBadge(); renderNotifDropdown();
        }
        function addAuditLog(entry) {
            entry.id = Date.now(); entry.time = formatTime(new Date()); entry.date = new Date().toLocaleDateString('ar-EG');
            auditLogs.unshift(entry);
            if (auditLogs.length > 100) auditLogs = auditLogs.slice(0, 100);
            saveNotifications();
            addNotification({ type: 'audit', title: '🔧 تعديل إجابة نموذجية', context: entry.context, questionNum: entry.questionNum, questionText: entry.questionText, oldAnswer: entry.oldAnswer, newAnswer: entry.newAnswer, read: false });
        }
        function updateNotifBadge() {
            var badge = document.getElementById('notif-badge');
            var unread = notifications.filter(function(n) { return !n.read; }).length;
            if (unread > 0) { badge.style.display = 'flex'; badge.textContent = unread > 99 ? '99+' : unread; } else { badge.style.display = 'none'; }
        }
        function toggleNotifDropdown() {
            var dd = document.getElementById('notif-dropdown');
            dd.classList.toggle('show');
            if (dd.classList.contains('show')) {
                renderNotifDropdown();
                notifications.forEach(function(n) { n.read = true; });
                saveNotifications(); updateNotifBadge();
            }
        }
        function clearAllNotifications(e) { e.stopPropagation(); notifications = []; saveNotifications(); updateNotifBadge(); renderNotifDropdown(); }
        function renderNotifDropdown() {
            var list = document.getElementById('notif-list');
            if (notifications.length === 0) { list.innerHTML = '<div class="notif-empty">لا توجد إشعارات حالياً</div>'; return; }
            var html = '';
            notifications.forEach(function(n) {
                var cls = n.read ? '' : 'unread';
                html += '<div class="notif-item ' + cls + '">';
                if (n.type === 'audit') {
                    html += '<strong>' + n.title + '</strong>';
                    html += '<span class="notif-detail">📁 ' + n.context + ' | سؤال #' + n.questionNum + '</span>';
                    html += '<span class="notif-detail">📝 السؤال: ' + truncateText(n.questionText, 60) + '</span>';
                    html += '<span class="notif-detail">❌ القديمة: <del>' + n.oldAnswer + '</del> → ✅ الجديدة: <strong>' + n.newAnswer + '</strong></span>';
                } else {
                    html += '<strong>' + (n.title || 'إشعار') + '</strong>';
                    if (n.context) html += '<span class="notif-detail">📁 ' + n.context + '</span>';
                    if (n.questionText) html += '<span class="notif-detail">📝 ' + truncateText(n.questionText, 60) + '</span>';
                }
                html += '<div class="notif-meta">🕐 ' + n.time + ' | 📅 ' + n.date + '</div>';
                html += '</div>';
            });
            list.innerHTML = html;
        }
        function truncateText(text, maxLen) { if (!text) return ''; return text.length > maxLen ? text.substring(0, maxLen) + '...' : text; }
        function simulateAnswerEdit(context, questionNum, questionText, oldAnswer, newAnswer) {
            addAuditLog({ context: context, questionNum: questionNum, questionText: questionText, oldAnswer: oldAnswer, newAnswer: newAnswer });
        }
        document.addEventListener('click', function(e) { var wrap = document.getElementById('notif-bell-wrap'); var dd = document.getElementById('notif-dropdown'); if (wrap && dd && !wrap.contains(e.target)) dd.classList.remove('show'); });

        // ========== Shared Answer-Edits Log ==========
        var answerEditsLog = [

        { id: "edit-004", context: "المحاضرة الأولى", questionNum: 3, questionText: "ما هو تعريف القانون في اللغة؟", oldAnswer: "الإجابة القديمة", newAnswer: "الإجابة الصحيحة الجديدة" },
         { id: "edit-002", context: "المحاضرة الأولى", questionNum: 2, questionText: "ما هو تعريف القانون في اللغة؟", oldAnswer: "الإجابة القديمة", newAnswer: "الإجابة الصحيحة الجديدة" },
        { id: "edit-003", context: "المحاضرة الأولى", questionNum: 1, questionText: "ما هو تعريف القانون في اللغة؟", oldAnswer: "الإجابة القديمة", newAnswer: "الإجابة الصحيحة الجديدة" }

        ];
        function syncAnswerEditsLog() {
            var seenIds = [];
            try { seenIds = JSON.parse(localStorage.getItem('seen_system_edits') || '[]'); } catch (e) { seenIds = []; }
            var changed = false;
            answerEditsLog.forEach(function(entry) {
                if (seenIds.indexOf(entry.id) === -1) {
                    addAuditLog({ context: entry.context, questionNum: entry.questionNum, questionText: entry.questionText, oldAnswer: entry.oldAnswer, newAnswer: entry.newAnswer });
                    seenIds.push(entry.id);
                    changed = true;
                }
            });
            if (changed) { try { localStorage.setItem('seen_system_edits', JSON.stringify(seenIds)); } catch (e) {} }
        }
        loadNotifications(); syncAnswerEditsLog(); updateNotifBadge();
/*

تعريف واهمية ووظائف القانون

        // ========== Card Creation ==========
        function getQuizScoreFromStorage(quizId) {
            try { var s = localStorage.getItem('quiz_' + quizId); if (s) { var state = JSON.parse(s); if (state && state.done && state.total > 0) { return { done: true, pct: Math.round((state.correct / state.total) * 100), correct: state.correct, total: state.total }; } } } catch (e) {}
            return { done: false, pct: 0, correct: 0, total: 0 };
        }

        function renderLectureContent(lecture) {
            var area = document.getElementById('lecture-content-area');
            if (lecture.pdf) {
                var encodedPdf = encodeURI(lecture.pdf);
                var fileName = (lecture.title || 'محاضرة') + '.pdf';
                area.innerHTML = 
                    '<div class="pdf-viewer">' +
                        '<iframe src="' + encodedPdf + '" allowfullscreen></iframe>' +
                    '</div>' +
                    '<div style="text-align:center; margin-top:20px;">' +
                        '<button class="show-score-btn" onclick="forceDownloadPDF(\'' + encodedPdf + '\', \'' + fileName.replace(/'/g, "\\'") + '\')">📥 تحميل PDF</button>' +
                        '<p style="margin-top:15px;"><a href="' + encodedPdf + '" target="_blank" rel="noopener" class="btn-sm" style="text-decoration:none;">🌐 فتح في متصفح آخر</a></p>' +
                    '</div>';
            }
        }

        function createCards(containerId, data, type, hideDownload) {
            var c = document.getElementById(containerId);
            c.innerHTML = '';
            data.forEach(function(item, index) {
                var card = document.createElement('div');
                card.className = 'card';
                var qid = (type === 'lectures' && containerId === 'questions-lectures-list') ? 'lectures-section2-' + index : type + '-' + index;
                var scoreInfo = getQuizScoreFromStorage(qid);
                var badgeHtml = '';
                if (item.interactive && scoreInfo.done) { badgeHtml = '<span class="badge done">✅ تم الحل</span>'; }
                else if (item.interactive) { badgeHtml = '<span class="badge new">📝 جديد</span>'; }
                var dlBtn = '';
                if (!hideDownload && item.pdf) {
                    var pdfToUse = (type === 'lectures' && containerId === 'questions-lectures-list' && item.pdf2) ? item.pdf2 : item.pdf;
                    var encodedPdf = encodeURI(pdfToUse);
                    var fileName = (item.title || 'ملف') + '.pdf';
                    dlBtn = '<button class="btn-sm" onclick="event.stopPropagation(); forceDownloadPDF(\'' + encodedPdf + '\', \'' + fileName.replace(/'/g, "\\'") + '\')">📥 تحميل PDF</button>';
                }
                if (item.interactive && !item.pdf) { dlBtn += '<button class="btn-sm btn-download-exam" onclick="event.stopPropagation();downloadExamWord(\'' + qid + '\')">📥 تحميل الامتحان</button>'; }
                card.innerHTML = '<div class="card-text"><h3>' + item.title + '</h3><p>' + (item.desc || '') + '</p></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' + badgeHtml + dlBtn + '</div>';
                card.addEventListener('click', function() {
                    if (type === 'lectures') {
                        if (containerId === 'lectures-list') openLecturePage(index);
                        else openInteractiveQuiz(item, qid);
                    } else {
                        openInteractiveQuiz(item, qid);
                    }
                });
                c.appendChild(card);
            });
        }

        // دالة التحميل – تضمن الترميز والتشغيل دائماً
        function forceDownloadPDF(url, filename) {
            var encodedUrl = encodeURI(url);
            fetch(encodedUrl)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                })
                .catch(() => {
                    // احتياطي: فتح في نافذة جديدة أو رابط مباشر
                    const a = document.createElement('a');
                    a.href = encodedUrl;
                    a.download = filename;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                });
        }

        function downloadExamWord(qid) {
            var exam = null;
            [midterms, finals, examModels, testBanks].forEach(function(arr) {
                arr.forEach(function(item, idx) {
                    var prefix = arr === midterms ? 'midterms' : arr === finals ? 'finals' : arr === examModels ? 'examModels' : 'testBanks';
                    if (qid === prefix + '-' + idx) exam = item;
                });
            });
            if (!exam) return;
            var html = '<html dir="rtl"><head><meta charset="UTF-8"><title>' + exam.title + '</title><style>body{font-family:Tahoma;padding:20px;line-height:2;}h2{color:#2c3e50;}li{margin:10px 0;}</style></head><body><h2>📝 ' + exam.title + '</h2>';
            exam.questions.forEach(function(q, i) { html += '<div style="margin-bottom:20px;"><b>' + (i + 1) + '. ' + q.text + '</b><ul>' + q.options.map(function(o) { return '<li>' + o + '</li>'; }).join('') + '</ul></div>'; });
            html += '</body></html>';
            var blob = new Blob([html], { type: 'application/msword' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = exam.title.replace(/\s/g, '_') + '.doc';
            a.click();
        }

        function refreshAllCards() {
            createCards('lectures-list', lectures, 'lectures', true);
            createCards('questions-lectures-list', lectures, 'lectures', false);
            createCards('midterms-list', midterms, 'midterms');
            createCards('finals-list', finals, 'finals');
            createCards('exam-models-list', examModels, 'examModels');
            createCards('test-banks-list', testBanks, 'testBanks');
        }
        refreshAllCards();

        function saveCurrentView() {
            var view = {
                type: 'main',
                activeTab: document.querySelector('.tab-button.active')?.textContent.includes('الأول') ? 'section1' : 'section2',
                activeSubTab: document.querySelector('.sub-tab-button.active')?.getAttribute('onclick')?.match(/'(sub-\w+)'/)?.[1] || 'sub-lectures',
                scrollX: window.scrollX, scrollY: window.scrollY
            };
            if (document.getElementById('lecture-view').classList.contains('active')) {
                view.type = 'lecture';
                view.lectureIndex = currentLectureIndex;
            } else if (document.getElementById('quiz-view').classList.contains('active')) {
                view.type = 'quiz';
                view.quizId = currentQuizId;
                view.quizTitle = document.getElementById('quiz-title').textContent;
            }
            localStorage.setItem('lastView', JSON.stringify(view));
        }

        function restoreLastView() {
            try {
                var saved = JSON.parse(localStorage.getItem('lastView'));
                if (!saved) return;
                if (saved.type === 'main') {
                    document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
                    document.getElementById(saved.activeTab).classList.add('active');
                    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                    document.querySelector('.tab-button[onclick*="' + saved.activeTab + '"]')?.classList.add('active');
                    if (saved.activeTab === 'section2') {
                        document.querySelectorAll('.sub-content').forEach(s => s.classList.remove('active'));
                        document.getElementById(saved.activeSubTab).classList.add('active');
                        document.querySelectorAll('.sub-tab-button').forEach(b => b.classList.remove('active'));
                        document.querySelector('.sub-tab-button[onclick*="' + saved.activeSubTab + '"]')?.classList.add('active');
                    }
                    refreshAllCards();
                    window.scrollTo(saved.scrollX || 0, saved.scrollY || 0);
                } else if (saved.type === 'lecture' && saved.lectureIndex != null) {
                    openLecturePage(saved.lectureIndex);
                    setTimeout(() => window.scrollTo(saved.scrollX || 0, saved.scrollY || 0), 100);
                } else if (saved.type === 'quiz' && saved.quizId) {
                    var exam = findExamById(saved.quizId);
                    if (exam) { openInteractiveQuiz(exam, saved.quizId); setTimeout(() => window.scrollTo(saved.scrollX || 0, saved.scrollY || 0), 100); }
                }
            } catch(e) {}
        }

        function findExamById(qid) {
            var parts = qid.split('-');
            var type = parts[0], idx = parseInt(parts[1]);
            if (type === 'lectures' || type === 'lectures-section2') return lectures[idx];
            if (type === 'midterms') return midterms[idx];
            if (type === 'finals') return finals[idx];
            if (type === 'examModels') return examModels[idx];
            if (type === 'testBanks') return testBanks[idx];
            return null;
        }

        // ========== Navigation ==========
        var currentLectureIndex = null;
        var currentQuizId = null;

        function openLecturePage(index) {
            currentLectureIndex = index;
            var l = lectures[index];
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('lecture-view').classList.add('active');
            document.getElementById('quiz-view').classList.remove('active');
            document.getElementById('lecture-title').textContent = l.title;
            renderLectureContent(l);
            var box = document.getElementById('lecture-questions-box');
            if (l.interactive && l.questions && l.questions.length > 0) {
                var qid = 'lecture-embedded-' + index;
                box.innerHTML = '<h3>أسئلة هذه المحاضرة</h3><div id="lq-h-' + index + '"></div><div class="quiz-scroll-container" id="lq-c-' + index + '"></div>';
                currentQuizExam = l;
                document.getElementById('quiz-download-btn').style.display = 'inline-block';
                buildQuiz(document.getElementById('lq-c-' + index), l, 'lq-fb-' + index + '-', qid, document.getElementById('lq-h-' + index));
            } else if (l.questions && l.questions.length > 0) {
                box.innerHTML = '<h3>أسئلة هذه المحاضرة</h3><ul id="lecture-questions"></ul>';
                var ul = document.getElementById('lecture-questions');
                l.questions.forEach(function(q) { var li = document.createElement('li'); li.textContent = q.text || q; ul.appendChild(li); });
            }
            window.scrollTo(0, 0);
            saveCurrentView();
        }

        function goBackToMain() {
            document.getElementById('lecture-view').classList.remove('active');
            document.getElementById('main-view').style.display = 'block';
            document.getElementById('quiz-download-btn').style.display = 'none';
            currentLectureIndex = null;
            refreshAllCards();
            window.scrollTo(0, 0);
            saveCurrentView();
        }

        function openInteractiveQuiz(exam, quizId) {
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('lecture-view').classList.remove('active');
            document.getElementById('quiz-view').classList.add('active');
            document.getElementById('quiz-title').textContent = exam.title;
            currentQuizExam = exam;
            currentQuizId = quizId;
            document.getElementById('quiz-download-btn').style.display = 'inline-block';
            buildQuiz(document.getElementById('quiz-scroll-container'), exam, 'q-fb-', quizId, document.getElementById('quiz-header-area'));
            window.scrollTo(0, 0);
            saveCurrentView();
        }

        function goBackFromQuiz() {
            document.getElementById('quiz-view').classList.remove('active');
            document.getElementById('main-view').style.display = 'block';
            document.getElementById('quiz-download-btn').style.display = 'none';
            currentQuizId = null;
            refreshAllCards();
            window.scrollTo(0, 0);
            saveCurrentView();
        }

        function openTab(evt, tabName) {
            document.querySelectorAll('.content-section').forEach(function(s) { s.classList.remove('active'); });
            document.getElementById(tabName).classList.add('active');
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            evt.currentTarget.classList.add('active');
            document.getElementById('main-view').style.display = 'block';
            document.getElementById('lecture-view').classList.remove('active');
            document.getElementById('quiz-view').classList.remove('active');
            refreshAllCards();
            saveCurrentView();
        }

        function openSubTab(evt, subTabName) {
            document.querySelectorAll('.sub-content').forEach(function(s) { s.classList.remove('active'); });
            document.querySelectorAll('.sub-tab-button').forEach(function(b) { b.classList.remove('active'); });
            document.getElementById(subTabName).classList.add('active');
            evt.currentTarget.classList.add('active');
            refreshAllCards();
            saveCurrentView();
        }

        function downloadBankFile() {
            fetch('bankqestions.html')
                .then(function(response) { return response.text(); })
                .then(function(htmlText) {
                    var blob = new Blob([htmlText], { type: 'text/html; charset=utf-8' });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = 'bankqestions.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                })
                .catch(function() { alert('حصل خطأ أثناء تحميل الملف'); });
        }

        // ========== Quiz Engine ==========
        var quizStates = {};
        var currentQuizExam = null;

        function getState(id, total) {
            if (!quizStates[id]) {
                var saved = null;
                try { saved = JSON.parse(localStorage.getItem('quiz_' + id)); } catch (e) {}
                quizStates[id] = (saved && saved.total === total) ? saved : { correct: 0, wrong: 0, answered: 0, total: total, done: false, wrongQuestions: [], answers: {} };
            }
            return quizStates[id];
        }

        function saveState(id) { localStorage.setItem('quiz_' + id, JSON.stringify(quizStates[id])); }

        function resetQuizState(id) { delete quizStates[id]; localStorage.removeItem('quiz_' + id); refreshAllCards(); }

        function buildQuiz(container, exam, fbPrefix, quizId, headerArea) {
            container.innerHTML = '';
            var state = getState(quizId, exam.questions.length);
            var isRestored = state.answered > 0;
            if (headerArea) {
                headerArea.innerHTML = '<div class="quiz-header"><div style="flex:1"><div class="progress-text" id="' + quizId + '-ptxt">تم الإجابة على ' + state.answered + ' من ' + exam.questions.length + '</div><div class="progress-bar-wrap"><div class="progress-bar-fill" id="' + quizId + '-pbar" style="width:' + Math.round((state.answered / state.total) * 100) + '%"></div></div></div><button class="reset-btn" id="' + quizId + '-rst">🔄 إعادة التعيين</button></div>';
                document.getElementById(quizId + '-rst').addEventListener('click', function() { resetQuizState(quizId); buildQuiz(container, exam, fbPrefix, quizId, headerArea); });
            }

            if (isRestored && state.done) {
                showScoreAndWrong(container, state, quizId, exam, fbPrefix, headerArea);
            }

            exam.questions.forEach(function(q, i) {
                var card = document.createElement('div');
                card.className = 'quiz-card';
                card.innerHTML = '<div class="quiz-number">' + (i + 1) + '</div><div class="quiz-question-text">' + q.text + '</div><div class="quiz-options"></div><div class="quiz-feedback" id="' + fbPrefix + i + '"></div>';
                var opts = card.querySelector('.quiz-options');
                q.options.forEach(function(opt) {
                    var btn = document.createElement('button');
                    btn.className = 'quiz-option-btn';
                    btn.textContent = opt;
                    btn.addEventListener('click', function() {
                        if (state.done) return;
                        var allBtns = opts.querySelectorAll('.quiz-option-btn');
                        allBtns.forEach(function(b) { b.classList.add('disabled'); });
                        state.answers[i] = opt;
                        var fb = document.getElementById(fbPrefix + i);
                        if (opt === q.answer) {
                            btn.classList.add('correct');
                            fb.innerHTML = '✅ إجابة صحيحة!';
                            fb.className = 'quiz-feedback show correct-text';
                            state.correct++;
                        } else {
                            btn.classList.add('incorrect');
                            allBtns.forEach(function(b) { if (b.textContent === q.answer) b.classList.add('correct'); });
                            fb.innerHTML = '❌ إجابة خاطئة — الصحيحة: ' + q.answer;
                            fb.className = 'quiz-feedback show wrong-text';
                            state.wrong++;
                            state.wrongQuestions.push({ text: q.text, options: q.options, userAnswer: opt, correctAnswer: q.answer });
                        }
                        state.answered++;
                        saveState(quizId);
                        var pct = Math.round((state.answered / state.total) * 100);
                        var bar = document.getElementById(quizId + '-pbar');
                        var txt = document.getElementById(quizId + '-ptxt');
                        if (bar) bar.style.width = pct + '%';
                        if (txt) txt.textContent = 'تم الإجابة على ' + state.answered + ' من ' + state.total;
                        if (state.answered === state.total) {
                            state.done = true;
                            saveState(quizId);
                            refreshAllCards();
                            showScoreAndWrong(container, state, quizId, exam, fbPrefix, headerArea);
                        }
                    });
                    opts.appendChild(btn);
                });
                if (isRestored && state.answers[i] !== undefined) {
                    var allBtns = card.querySelectorAll('.quiz-option-btn');
                    allBtns.forEach(function(b) { b.classList.add('disabled'); });
                    var fb = document.getElementById(fbPrefix + i);
                    if (state.answers[i] === q.answer) {
                        allBtns.forEach(function(b) { if (b.textContent === q.answer) b.classList.add('correct'); });
                        fb.innerHTML = '✅ إجابة صحيحة!';
                        fb.className = 'quiz-feedback show correct-text';
                    } else {
                        allBtns.forEach(function(b) { if (b.textContent === state.answers[i]) b.classList.add('incorrect'); if (b.textContent === q.answer) b.classList.add('correct'); });
                        fb.innerHTML = '❌ إجابة خاطئة — الصحيحة: ' + q.answer;
                        fb.className = 'quiz-feedback show wrong-text';
                    }
                }
                container.appendChild(card);
            });
            container.scrollTop = 0;
        }

        function showScoreAndWrong(container, state, quizId, exam, fbPrefix, headerArea) {
            var oldScore = document.getElementById(quizId + '-score-card');
            if (oldScore) oldScore.remove();
            var oldWrong = document.getElementById(quizId + '-wrong-collapse-wrap');
            if (oldWrong) oldWrong.remove();
            var oldSummary = document.getElementById(quizId + '-progress-summary');
            if (oldSummary) oldSummary.remove();
            
            var pct = Math.round((state.correct / state.total) * 100);
            var msg = '';
            if (pct >= 90) { msg = '🎉 ممتاز! أداء رائع'; }
            else if (pct >= 80) { msg = '👍 جيد! يمكنك التحسن أكثر'; }
            else { msg = '💪 تحتاج مراجعة أكثر'; }
            
            var sc = document.createElement('div');
            sc.className = 'score-card';
            sc.id = quizId + '-score-card';
            sc.innerHTML = '<div class="score-circle"><div class="score-number">' + pct + '%</div><div class="score-label">الدرجة</div></div><div class="score-message">' + msg + '</div><div class="score-details">✅ صحيحة: ' + state.correct + ' | ❌ خاطئة: ' + state.wrong + ' | 📝 الإجمالي: ' + state.total + '</div><button class="retry-btn" id="' + quizId + '-retry">🔄 إعادة المحاولة</button>';
            container.appendChild(sc);
            document.getElementById(quizId + '-retry').addEventListener('click', function() {
                resetQuizState(quizId);
                buildQuiz(container, exam, fbPrefix, quizId, headerArea);
                container.scrollTop = 0;
            });
            
            if (state.wrongQuestions && state.wrongQuestions.length > 0) {
                var collapseWrap = document.createElement('div');
                collapseWrap.className = 'wrong-collapse-wrap';
                collapseWrap.id = quizId + '-wrong-collapse-wrap';
                var collapseHeader = document.createElement('div');
                collapseHeader.className = 'wrong-collapse-header';
                collapseHeader.innerHTML = '<span>❌ الأسئلة الخاطئة <span class="wrong-collapse-count">' + state.wrongQuestions.length + ' سؤال</span></span><span style="display:flex;align-items:center;gap:8px;"><button class="wrong-dl-btn" onclick="event.stopPropagation();downloadWrongAsWord(\'' + quizId + '\',\'' + exam.title + '\')">📥 تحميل Word</button><span class="wrong-collapse-arrow open" id="' + quizId + '-arrow">▼</span></span>';
                var collapseBody = document.createElement('div');
                collapseBody.className = 'wrong-collapse-body open';
                collapseBody.id = quizId + '-collapse-body';
                
                state.wrongQuestions.forEach(function(wq, idx) {
                    var card = document.createElement('div');
                    card.className = 'wrong-q-card';
                    var optsHtml = wq.options ? '<div class="wrong-q-options-list">الاختيارات: ' + wq.options.map(function(o) { return '<span style="display:inline-block;margin:2px 6px;padding:2px 8px;border:1px solid var(--border);border-radius:4px;">' + o + '</span>'; }).join(' ') + '</div>' : '';
                    card.innerHTML = '<span class="wrong-q-num">' + (idx + 1) + '</span><div class="wrong-q-text">' + wq.text + '</div>' + optsHtml + '<div class="wrong-q-answer wrong-q-user"><span class="wrong-q-label">❌ إجابتك:</span>' + wq.userAnswer + '</div>' + '<div class="wrong-q-answer wrong-q-correct"><span class="wrong-q-label">✅ الإجابة الصحيحة:</span>' + wq.correctAnswer + '</div>';
                    collapseBody.appendChild(card);
                });
                collapseHeader.addEventListener('click', function(e) {
                    if (e.target.classList.contains('wrong-dl-btn')) return;
                    var body = document.getElementById(quizId + '-collapse-body');
                    var arrow = document.getElementById(quizId + '-arrow');
                    var isOpen = body.classList.contains('open');
                    if (isOpen) { body.classList.remove('open'); arrow.classList.remove('open'); }
                    else { body.classList.add('open'); arrow.classList.add('open'); }
                });
                collapseWrap.appendChild(collapseHeader);
                collapseWrap.appendChild(collapseBody);
                container.appendChild(collapseWrap);
            } else {
                var noW = document.createElement('div');
                noW.className = 'no-wrong-msg';
                noW.textContent = '🏆 أحسنت! أجبت على جميع الأسئلة بشكل صحيح!';
                container.appendChild(noW);
            }
            
            var summary = buildProgressSummary();
            summary.id = quizId + '-progress-summary';
            container.appendChild(summary);
            
            var bar = document.getElementById(quizId + '-pbar');
            if (bar) bar.style.width = '100%';
            setTimeout(function() { sc.scrollIntoView({ behavior: 'smooth' }); }, 200);
        }

        function buildProgressSummary() {
            var summary = document.createElement('div');
            summary.className = 'progress-summary';
            summary.innerHTML = '<h3>📊 ملخص التقدم في جميع الأقسام</h3>';
            var categories = [
                { name: '📚 أسئلة المحاضرات', type: 'lectures', data: lectures, subTab: 'sub-lectures' },
                { name: '📝 أسئلة الميدتيرم', type: 'midterms', data: midterms, subTab: 'sub-mid' },
                { name: '🎓 أسئلة الفاينل', type: 'finals', data: finals, subTab: 'sub-final' },
                { name: '📋 نماذج الامتحانات', type: 'examModels', data: examModels, subTab: 'sub-exam-model' },
                { name: '🏦 بنك الأسئلة', type: 'testBanks', data: testBanks, subTab: 'sub-test-bank' }
            ];
            categories.forEach(function(cat) {
                var total = cat.data.length;
                var completed = 0;
                cat.data.forEach(function(item, idx) {
                    var qid = cat.type + '-' + idx;
                    var info = getQuizScoreFromStorage(qid);
                    if (info.done) completed++;
                });
                var row = document.createElement('div');
                row.className = 'progress-summary-row';
                row.innerHTML = '<span class="ps-name">' + cat.name + '</span><div class="ps-stats" style="display:flex;gap:8px;flex-wrap:wrap;"><span class="ps-badge total">📦 ' + total + ' عنصر</span><span class="ps-badge ' + (completed > 0 ? 'done' : 'pending') + '">✅ حلّيت: ' + completed + '</span><span class="ps-badge pending">⏳ متبقي: ' + (total - completed) + '</span></div>';
                row.addEventListener('click', function() {
                    document.getElementById('main-view').style.display = 'block';
                    document.getElementById('lecture-view').classList.remove('active');
                    document.getElementById('quiz-view').classList.remove('active');
                    document.querySelectorAll('.content-section').forEach(function(s) { s.classList.remove('active'); });
                    document.getElementById('section2').classList.add('active');
                    document.querySelectorAll('.sub-content').forEach(function(s) { s.classList.remove('active'); });
                    document.querySelectorAll('.sub-tab-button').forEach(function(b) { b.classList.remove('active'); });
                    document.getElementById(cat.subTab).classList.add('active');
                    var subTabBtn = document.querySelector('.sub-tab-button[onclick*="' + cat.subTab + '"]');
                    if (subTabBtn) subTabBtn.classList.add('active');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                summary.appendChild(row);
            });
            return summary;
        }

        function downloadWrongAsWord(quizId, examTitle) {
            var state = quizStates[quizId];
            if (!state || !state.wrongQuestions || state.wrongQuestions.length === 0) { alert('لا توجد أسئلة خاطئة لتحميلها.'); return; }
            var html = '<html dir="rtl"><head><meta charset="UTF-8"><title>الأسئلة الخاطئة - ' + examTitle + '</title><style>body{font-family:Tahoma,sans-serif;direction:rtl;padding:20px;line-height:2;}h2{text-align:center;color:#e74c3c;}.q-block{border:1px solid #ddd;padding:15px;margin:15px 0;border-radius:8px;}.q-text{font-weight:bold;font-size:16px;}.wrong{background:#fdecea;padding:8px;border-right:4px solid #e74c3c;margin:8px 0;}.correct{background:#eafaf1;padding:8px;border-right:4px solid #27ae60;margin:8px 0;}.label{font-weight:bold;font-size:13px;display:block;}</style></head><body><h2>❌ الأسئلة الخاطئة - ' + examTitle + '</h2><p>عدد الأسئلة الخاطئة: <strong>' + state.wrongQuestions.length + '</strong></p>';
            state.wrongQuestions.forEach(function(wq, idx) {
                html += '<div class="q-block"><p><strong>سؤال #' + (idx + 1) + ':</strong></p><p class="q-text">' + wq.text + '</p>';
                if (wq.options && wq.options.length > 0) { html += '<p><strong>الاختيارات:</strong> ' + wq.options.join(' | ') + '</p>'; }
                html += '<div class="wrong"><span class="label">❌ إجابتك:</span>' + wq.userAnswer + '</div>';
                html += '<div class="correct"><span class="label">✅ الإجابة الصحيحة:</span>' + wq.correctAnswer + '</div></div>';
            });
            html += '</body></html>';
            var blob = new Blob([html], { type: 'application/msword' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'الأسئلة_الخاطئة_' + examTitle.replace(/[^a-zA-Z0-9\u0621-\u064A]/g, '_') + '.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }

        function downloadCurrentQuiz() {
            if (!currentQuizExam) return;
            var html = '<html dir="rtl"><head><meta charset="UTF-8"><title>' + currentQuizExam.title + '</title><style>body{font-family:Tahoma;padding:20px;line-height:2;}h2{color:#2c3e50;}</style></head><body><h2>📝 ' + currentQuizExam.title + '</h2>';
            currentQuizExam.questions.forEach(function(q, i) { html += '<div style="margin-bottom:20px;"><b>' + (i + 1) + '. ' + q.text + '</b><ul>' + q.options.map(function(o) { return '<li>' + o + '</li>'; }).join('') + '</ul></div>'; });
            html += '</body></html>';
            var blob = new Blob([html], { type: 'application/msword' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'أسئلة_' + currentQuizExam.title.replace(/\s/g, '_') + '.doc';
            a.click();
        }

        window.addEventListener('load', function() {
            restoreLastView();
            window.addEventListener('beforeunload', saveCurrentView);
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function() { console.log('SW ✓'); }).catch(function(err) { console.log('SW ✗', err); });
            });
        }

        console.log('✅ المنصة جاهزة للنشر على GitHub Pages مع ترميز المسارات');
